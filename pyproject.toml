[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "japanese-goro-llm"
version = "0.1.0"
description = "Reproducible research baseline for Japanese mnemonic (語呂合わせ) generation with phonetic retrieval and local LLMs."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Masaaki Ikeda"}]
dependencies = [
  "httpx>=0.27,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]
research = ["datasets>=2.20,<5"]
train = [
  "datasets>=2.20,<5",
  "transformers>=4.45,<6",
  "peft>=0.13,<1",
  "trl>=0.12,<1",
  "accelerate>=1,<2",
  "bitsandbytes>=0.44,<1; platform_system == 'Linux'",
]

[project.scripts]
goro-retrieve = "goro_llm.cli:retrieve_main"
goro-experiment = "goro_llm.cli:experiment_main"
goro-make-eval = "goro_llm.cli:eval_main"
goro-profile-ablation = "goro_llm.cli:ablation_main"

[tool.setuptools.packages.find]
include = ["goro_llm*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
